name: Update README stats

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100
            })

            const published = releases.filter(r => !r.draft)
            const assets = published.flatMap(r => r.assets || [])

            const totalDownloads = assets.reduce(
              (sum, asset) => sum + (asset.download_count || 0),
              0
            )

            const jarDownloads = assets
              .filter(asset => asset.name.toLowerCase().endsWith(".jar"))
              .reduce(
                (sum, asset) => sum + (asset.download_count || 0),
                0
              )

            let latestTag = "—"
            let latestUrl = `https://github.com/${owner}/${repo}/releases`
            let latestDate = "—"

            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner,
                repo
              })

              latestTag = latest.tag_name
              latestUrl = latest.html_url
              latestDate = (
                latest.published_at ||
                latest.created_at ||
                ""
              ).slice(0, 10) || "—"
            } catch (error) {
              if (error.status !== 404) throw error
            }

            const block = `## 📊 Статистика проекта

            | Показатель | Значение |
            |---|---:|
            | 📥 Всего скачиваний файлов | **${totalDownloads}** |
            | 🧩 Скачиваний \`.jar\` модов | **${jarDownloads}** |
            | 🚀 Всего релизов | **${published.length}** |
            | 📦 Всего файлов в релизах | **${assets.length}** |
            | 🆕 Последний опубликованный релиз | **[\`${latestTag}\`](${latestUrl})** |
            | 📅 Дата последнего релиза | **${latestDate}** |

            [➡️ Все релизы HubSwap](https://github.com/${owner}/${repo}/releases)

            ---`

            const { data: file } = await github.rest.repos.getContent({
              owner,
              repo,
              path: "README.md",
              ref: "main"
            })

            const current = Buffer.from(file.content, "base64").toString("utf8")
            const updated = current.replace(
              /## 📊 Статистика проекта[\s\S]*?\n---/,
              block
            )

            if (updated === current) {
              core.info("README statistics are already up to date")
              return
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: "README.md",
              message: "Update project statistics",
              content: Buffer.from(updated).toString("base64"),
              sha: file.sha,
              branch: "main"
            })
