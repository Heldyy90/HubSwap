name: Update README stats

on:
  workflow_dispatch:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Update README statistics
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const currentOwner = context.repo.owner
            const currentRepo = context.repo.repo
            const oldOwner = "Heldyy90"
            const oldRepo = "HubSwap"

            async function getPublicReleases(owner, repo) {
              const all = []
              let page = 1

              while (true) {
                const response = await fetch(
                  `https://api.github.com/repos/${owner}/${repo}/releases?per_page=100&page=${page}`,
                  {
                    headers: {
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "HubSwap-stats"
                    }
                  }
                )

                if (!response.ok) {
                  throw new Error(
                    `GitHub API ${owner}/${repo}: ${response.status}`
                  )
                }

                const data = await response.json()

                if (!Array.isArray(data)) {
                  throw new Error(`Invalid releases response for ${owner}/${repo}`)
                }

                all.push(...data)

                if (data.length < 100) {
                  break
                }

                page++
              }

              return all.filter(release => !release.draft)
            }

            function normalizeVersion(tag) {
              const value = String(tag || "")
                .toLowerCase()
                .replace(/[^0-9.]/g, "")
                .replace(/^\.+|\.+$/g, "")

              return value || String(tag || "").toLowerCase()
            }

            const oldReleases = await getPublicReleases(oldOwner, oldRepo)
            const currentReleases = await getPublicReleases(
              currentOwner,
              currentRepo
            )

            const allReleases = [...oldReleases, ...currentReleases]
            const allAssets = allReleases.flatMap(
              release => release.assets || []
            )

            const totalDownloads = allAssets.reduce(
              (sum, asset) => sum + Number(asset.download_count || 0),
              0
            )

            const jarDownloads = allAssets
              .filter(asset =>
                String(asset.name || "").toLowerCase().endsWith(".jar")
              )
              .reduce(
                (sum, asset) => sum + Number(asset.download_count || 0),
                0
              )

            const uniqueReleases = new Map()

            for (const release of oldReleases) {
              uniqueReleases.set(
                normalizeVersion(release.tag_name),
                release
              )
            }

            for (const release of currentReleases) {
              uniqueReleases.set(
                normalizeVersion(release.tag_name),
                release
              )
            }

            const uniqueAssets = new Map()

            for (const release of allReleases) {
              const version = normalizeVersion(release.tag_name)

              for (const asset of release.assets || []) {
                const key =
                  `${version}|${String(asset.name || "").toLowerCase()}`

                if (!uniqueAssets.has(key)) {
                  uniqueAssets.set(key, asset)
                }
              }
            }

            let latestTag = "—"
            let latestUrl =
              `https://github.com/${currentOwner}/${currentRepo}/releases`
            let latestDate = "—"

            const normalCurrent = currentReleases
              .filter(release => !release.prerelease)
              .sort((a, b) => {
                const ad = new Date(
                  a.published_at || a.created_at || 0
                ).getTime()

                const bd = new Date(
                  b.published_at || b.created_at || 0
                ).getTime()

                return bd - ad
              })

            if (normalCurrent.length > 0) {
              const latest = normalCurrent[0]
              latestTag = latest.tag_name
              latestUrl = latest.html_url
              latestDate = (
                latest.published_at ||
                latest.created_at ||
                ""
              ).slice(0, 10) || "—"
            }

            const lines = [
              "## 📊 Статистика проекта",
              "",
              "| Показатель | Значение |",
              "|---|---:|",
              `| 📥 Всего скачиваний файлов | **${totalDownloads}** |`,
              `| 🧩 Скачиваний \`.jar\` модов | **${jarDownloads}** |`,
              `| 🚀 Всего релизов | **${uniqueReleases.size}** |`,
              `| 📦 Всего файлов в релизах | **${uniqueAssets.size}** |`,
              `| 🆕 Последний опубликованный релиз | **[\`${latestTag}\`](${latestUrl})** |`,
              `| 📅 Дата последнего релиза | **${latestDate}** |`,
              "",
              `[➡️ Все релизы HubSwap](https://github.com/${currentOwner}/${currentRepo}/releases)`,
              "",
              "---"
            ]

            const block = lines.join("\n")

            const fileResponse = await github.rest.repos.getContent({
              owner: currentOwner,
              repo: currentRepo,
              path: "README.md",
              ref: "main"
            })

            const file = fileResponse.data

            if (Array.isArray(file) || !file.content || !file.sha) {
              throw new Error("README.md not found")
            }

            const current = Buffer
              .from(file.content, "base64")
              .toString("utf8")

            const start = current.indexOf("## 📊 Статистика проекта")

            if (start === -1) {
              throw new Error("Statistics section not found in README.md")
            }

            const separator = current.indexOf("\n---", start)

            if (separator === -1) {
              throw new Error("Statistics section end not found in README.md")
            }

            const end = separator + 4

            const updated =
              current.slice(0, start) +
              block +
              current.slice(end)

            if (updated === current) {
              core.info("Statistics are already up to date")
              return
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: currentOwner,
              repo: currentRepo,
              path: "README.md",
              message: "Update project statistics",
              content: Buffer
                .from(updated, "utf8")
                .toString("base64"),
              sha: file.sha,
              branch: "main"
            })

            core.info(
              `Downloads=${totalDownloads}, JAR=${jarDownloads}, releases=${uniqueReleases.size}, files=${uniqueAssets.size}, latest=${latestTag}`
            )
