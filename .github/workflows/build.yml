name: Build HubSwap player ranges 1.21.11

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Apply player source overlay
        run: |
          cat .ci/chunks2/*.txt | tr -d '\n\r' | base64 -d > /tmp/player-ranges-overlay.zip
          unzip -o /tmp/player-ranges-overlay.zip -d . || true
          cp .ci/ChatHudMixin.java src/main/java/ru/heldyy/hubswap/mixin/ChatHudMixin.java
          rm -rf src/main/java/ru/heldyy/hubswap/linkify
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HubSwap-1.21.11-1.0.7-ranges
          path: build/libs/*.jar
