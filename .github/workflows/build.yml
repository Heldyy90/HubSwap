name: Build HubSwap 1.21.11

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HubSwap-1.21.11-1.0.7
          path: build/libs/*.jar
